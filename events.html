<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Événements — The Hen House</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<script src="maintenance-check.js"></script>

<header>
  <div class="container nav">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" data-site-logo alt="The Hen House">
    </a>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="menu.html">Carte</a>
      <a href="events.html" class="active">Événements</a>
      <a href="reservation.html">Réserver</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <a class="btn" href="reservation.html">Réserver</a>
      <a class="btn" href="runner.html">Employés</a>
      <a class="btn admin-header-btn" href="events-admin.html">Administration</a>
    </div>
  </div>
</header>

<main>
  <section class="page-hero events-page-hero">
    <div class="container">
      <div class="kicker">The Hen House</div>
      <h1>Événements</h1>
      <p>Retrouvez toutes les soirées et événements du Hen House.</p>
    </div>
  </section>

  <section id="calendrier" class="calendar-section">
    <div class="container calendar-container">
      <div class="calendar-toolbar">
        <button class="calendar-nav" id="prevMonth" type="button" aria-label="Mois précédent">‹</button>
        <h2 id="calendarTitle"></h2>
        <button class="calendar-nav" id="nextMonth" type="button" aria-label="Mois suivant">›</button>
      </div>

      <div class="calendar-weekdays">
        <div>LUN</div><div>MAR</div><div>MER</div><div>JEU</div>
        <div>VEN</div><div>SAM</div><div>DIM</div>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </section>

  <div class="event-modal" id="eventModal" aria-hidden="true">
    <div class="event-modal-backdrop" id="eventModalBackdrop"></div>

    <article class="event-modal-card" role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
      <button id="eventModalClose" class="event-modal-close" type="button" aria-label="Fermer">×</button>

      <img id="eventModalImage" class="event-modal-image hidden" src="" alt="">

      <div class="event-modal-content">
        <div id="eventModalDate" class="event-modal-date"></div>
        <h2 id="eventModalTitle"></h2>
        <p id="eventModalDescription"></p>
      </div>
    </article>
  </div>
</main>

<footer>
  <div class="container">
    <p>THE HEN HOUSE • PALETO BAY • SAN ANDREAS</p>
    <p>© 2026 The Hen House</p>
  </div>
</footer>

<script src="background-loader.js"></script>
<script src="logo-loader.js"></script>

<script>
(function(){
  "use strict";

  const API_URL="https://thehenhouse-reservation.maxgamingdu4.workers.dev";

  const calendarGrid=document.getElementById("calendarGrid");
  const calendarTitle=document.getElementById("calendarTitle");
  const prevMonth=document.getElementById("prevMonth");
  const nextMonth=document.getElementById("nextMonth");

  const eventModal=document.getElementById("eventModal");
  const eventModalImage=document.getElementById("eventModalImage");
  const eventModalDate=document.getElementById("eventModalDate");
  const eventModalTitle=document.getElementById("eventModalTitle");
  const eventModalDescription=document.getElementById("eventModalDescription");
  const eventModalClose=document.getElementById("eventModalClose");
  const eventModalBackdrop=document.getElementById("eventModalBackdrop");

  let events=[];
  let currentMonth=new Date();

  function escapeHtml(value){
    return String(value).replace(/[&<>"']/g,function(match){
      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[match];
    });
  }

  function formatDate(date){
    if(!date) return "Date à définir";

    const parts=date.split("-");
    if(parts.length!==3) return date;

    const value=new Date(
      Number(parts[0]),
      Number(parts[1])-1,
      Number(parts[2])
    );

    return new Intl.DateTimeFormat("fr-FR",{
      day:"2-digit",
      month:"long",
      year:"numeric"
    }).format(value);
  }

  function openEvent(event){
    eventModalTitle.textContent=event.title || "Événement";
    eventModalDate.textContent=
      formatDate(event.date)+(event.time ? " • "+event.time : "");
    eventModalDescription.textContent=
      event.description || "Aucune description disponible.";

    if(event.image){
      eventModalImage.src=event.image;
      eventModalImage.alt=event.title || "Affiche de l'événement";
      eventModalImage.classList.remove("hidden");
    }else{
      eventModalImage.removeAttribute("src");
      eventModalImage.alt="";
      eventModalImage.classList.add("hidden");
    }

    eventModal.classList.add("open");
    eventModal.setAttribute("aria-hidden","false");
    document.body.classList.add("modal-open");
  }

  function closeEvent(){
    eventModal.classList.remove("open");
    eventModal.setAttribute("aria-hidden","true");
    document.body.classList.remove("modal-open");
  }

  function createDayCell(day, outside){
    const cell=document.createElement("div");
    cell.className="calendar-day"+(outside ? " outside" : "");

    const number=document.createElement("div");
    number.className="calendar-day-number";
    number.textContent=day;

    cell.appendChild(number);
    return cell;
  }

  function renderCalendar(){
    calendarGrid.innerHTML="";

    const year=currentMonth.getFullYear();
    const month=currentMonth.getMonth();

    calendarTitle.textContent=new Intl.DateTimeFormat("fr-FR",{
      month:"long",
      year:"numeric"
    }).format(currentMonth);

    const firstDay=new Date(year,month,1);
    const offset=firstDay.getDay()===0 ? 6 : firstDay.getDay()-1;
    const daysInMonth=new Date(year,month+1,0).getDate();

    for(let i=offset-1;i>=0;i--){
      const previousMonthDays=new Date(year,month,0).getDate();
      calendarGrid.appendChild(
        createDayCell(previousMonthDays-i,true)
      );
    }

    for(let day=1;day<=daysInMonth;day++){
      const dateKey=
        year+"-"+
        String(month+1).padStart(2,"0")+"-"+
        String(day).padStart(2,"0");

      const cell=createDayCell(day,false);

      const dayEvents=events.filter(function(event){
        return event.date===dateKey;
      });

      dayEvents.forEach(function(event){
        const button=document.createElement("button");

        button.type="button";
        button.className="calendar-event";
        button.innerHTML=
          (event.image
            ? '<img src="'+escapeHtml(event.image)+'" alt="">'
            : '')+
          '<span class="calendar-event-title">'+
            escapeHtml(event.title)+
          '</span>'+
          (event.time
            ? '<span class="calendar-event-time">'+
              escapeHtml(event.time)+
              '</span>'
            : '');

        button.addEventListener("click",function(){
          openEvent(event);
        });

        cell.appendChild(button);
      });

      calendarGrid.appendChild(cell);
    }

    const totalCells=offset+daysInMonth;
    const remaining=(7-(totalCells%7))%7;

    for(let day=1;day<=remaining;day++){
      calendarGrid.appendChild(createDayCell(day,true));
    }
  }

  async function loadEvents(){
    try{
      const response=await fetch(API_URL+"/events",{cache:"no-store"});
      const data=await response.json();

      events=(data.events || []).map(function(event){
        return {
          id:event.id,
          title:event.title || "Événement",
          date:event.date || "",
          time:event.time || "",
          description:event.description || "",
          image:event.image_url || ""
        };
      });

      renderCalendar();
    }catch(error){
      console.error("Erreur événements :",error);
      calendarGrid.innerHTML=
        '<div class="calendar-error">Impossible de charger les événements.</div>';
    }
  }

  prevMonth.addEventListener("click",function(){
    currentMonth=new Date(
      currentMonth.getFullYear(),
      currentMonth.getMonth()-1,
      1
    );
    renderCalendar();
  });

  nextMonth.addEventListener("click",function(){
    currentMonth=new Date(
      currentMonth.getFullYear(),
      currentMonth.getMonth()+1,
      1
    );
    renderCalendar();
  });

  eventModalClose.addEventListener("click",closeEvent);
  eventModalBackdrop.addEventListener("click",closeEvent);

  document.addEventListener("keydown",function(event){
    if(event.key==="Escape"){
      closeEvent();
    }
  });

  loadEvents();
})();
</script>

</body>
</html>
