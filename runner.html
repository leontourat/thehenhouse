<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace Runner — The Hen House</title><link rel="stylesheet" href="style.css"></head><body class="runner-page"><main class="runner-shell"><div class="runner-kicker">THE HEN HOUSE · PALETO BAY</div><h1>Espace <span>Runner</span></h1><p class="runner-lead">Déclarez vos runs effectués en quelques secondes.</p><section class="runner-card" id="runnerLogin"><h2>Accès employés</h2><form id="runnerLoginForm"><label for="runnerCode">Code commun des employés</label><input id="runnerCode" type="password" autocomplete="off" required placeholder="Code d'accès"><button type="submit" class="runner-primary">Se connecter</button></form><p class="runner-feedback" id="runnerLoginMessage" role="status"></p></section><section class="runner-card" id="runnerFormSection" hidden><div class="runner-card-head"><h2>Déclarer un run</h2><button type="button" id="runnerLogout" class="runner-outline">Déconnexion</button></div><form id="runnerDeclaration"><div class="runner-form-grid"><div><label for="runnerLastName">Nom</label><input id="runnerLastName" maxlength="80" required autocomplete="family-name"></div><div><label for="runnerFirstName">Prénom</label><input id="runnerFirstName" maxlength="80" required autocomplete="given-name"></div></div><label for="runnerPhone">Numéro de téléphone</label><input id="runnerPhone" maxlength="60" required autocomplete="tel"><label class="runner-check"><input id="runnerCompleted" type="checkbox" required><span>Je confirme avoir effectué ce run</span></label><button type="submit" id="runnerSubmit" class="runner-primary">Envoyer ma déclaration</button></form><p class="runner-feedback" id="runnerFeedback" role="status"></p></section><p class="runner-back"><a href="index.html">← Retour à l'accueil</a></p></main><script>
(function(){const API="https://thehenhouse-reservation.maxgamingdu4.workers.dev",g=id=>document.getElementById(id);let code="";function show(id,text){g(id).textContent=text;}g("runnerLoginForm").addEventListener("submit",async e=>{e.preventDefault();code=g("runnerCode").value.trim();try{const r=await fetch(API+"/runner/verify",{headers:{Authorization:"Bearer "+code}});if(!r.ok)throw Error("Code employé incorrect.");g("runnerLogin").hidden=true;g("runnerFormSection").hidden=false;show("runnerLoginMessage","");}catch(err){show("runnerLoginMessage",err.message);code="";}});g("runnerLogout").addEventListener("click",()=>{code="";g("runnerCode").value="";g("runnerLogin").hidden=false;g("runnerFormSection").hidden=true;});g("runnerDeclaration").addEventListener("submit",async e=>{e.preventDefault();const btn=g("runnerSubmit");btn.disabled=true;show("runnerFeedback","Enregistrement...");try{const r=await fetch(API+"/runner/runs",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+code},body:JSON.stringify({last_name:g("runnerLastName").value.trim(),first_name:g("runnerFirstName").value.trim(),phone:g("runnerPhone").value.trim(),completed:g("runnerCompleted").checked})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"Erreur d'envoi");g("runnerCompleted").checked=false;show("runnerFeedback",d.discord_sent?"✓ Run enregistré et envoyé sur Discord.":"✓ Run enregistré. Attention : notification Discord non envoyée.");}catch(err){show("runnerFeedback",err.message);}finally{btn.disabled=false;}});})();
</script></body></html>
