<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administration — The Hen House</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #2a2113 0%, #0b0b0b 45%, #050505 100%);
      color: #fff;
    }

    .container {
      width: min(1100px, 92%);
      margin: 40px auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      color: #d4af5a;
      font-size: 32px;
    }

    .subtitle {
      color: #aaa;
      margin-top: 8px;
    }

    .card {
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid rgba(212, 175, 90, 0.25);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    .login {
      max-width: 500px;
      margin: 100px auto;
      text-align: center;
    }

    input,
    textarea {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid #333;
      color: white;
      padding: 13px;
      border-radius: 8px;
      margin-top: 7px;
      margin-bottom: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #d4af5a;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    label {
      display: block;
      color: #d4af5a;
      font-weight: bold;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      transition: .2s;
    }

    .primary {
      background: #d4af5a;
      color: #111;
    }

    .primary:hover {
      background: #e5c575;
      transform: translateY(-1px);
    }

    .danger {
      background: #8f2d2d;
      color: white;
    }

    .danger:hover {
      background: #b63b3b;
    }

    .secondary {
      background: #292929;
      color: white;
    }

    .secondary:hover {
      background: #3a3a3a;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      display: block;
      background: rgba(40, 130, 70, .2);
      border: 1px solid #348653;
      color: #8de0a8;
    }

    .error {
      display: block;
      background: rgba(150, 40, 40, .2);
      border: 1px solid #a33;
      color: #ff9999;
    }

    .events-list {
      display: grid;
      gap: 15px;
    }

    .event {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 18px;
      background: #101010;
      border: 1px solid #292929;
      border-radius: 12px;
    }

    .event-info {
      flex: 1;
    }

    .event-title {
      color: #d4af5a;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .event-meta {
      color: #aaa;
      font-size: 14px;
    }

    .event-description {
      color: #ccc;
      margin-top: 8px;
      white-space: pre-wrap;
    }

    .event-image {
      width: 100px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .event {
        flex-direction: column;
        align-items: stretch;
      }

      .event-image {
        width: 100%;
        height: 180px;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginSection" class="card login">

    <h1>🐔 The Hen House</h1>

    <p class="subtitle">
      Administration des événements
    </p>

    <label for="adminCode">Code administrateur</label>

    <input
      type="password"
      id="adminCode"
      placeholder="Entrez votre code"
    >

    <button class="primary" onclick="login()">
      Se connecter
    </button>

    <div id="loginMessage" class="message"></div>

  </section>


  <!-- ADMIN -->
  <main id="adminSection" class="container hidden">

    <div class="header">

      <div>
        <h1>Administration</h1>

        <div class="subtitle">
          Gestion des événements — The Hen House
        </div>
      </div>

        <div class="top-actions">
        
          <button
            class="secondary"
            onclick="window.location.href='events.html'"
          >
            ← Retour aux événements
          </button>
      
          <button
            class="secondary"
            onclick="loadEvents()"
          >
            ↻ Actualiser
          </button>
      
          <button
            class="danger"
            onclick="logout()"
          >
            Déconnexion
          </button>
      
        </div>

    </div>


    <!-- FORMULAIRE -->

    <section class="card">

      <h2 id="formTitle">➕ Ajouter un événement</h2>

      <form id="eventForm">

        <div class="form-grid">

          <div class="full">

            <label for="title">
              Titre de l'événement
            </label>

            <input
              type="text"
              id="title"
              placeholder="Ex : Soirée Halloween"
              required
            >

          </div>


          <div>

            <label for="date">
              Date
            </label>

            <input
              type="date"
              id="date"
              required
            >

          </div>


          <div>

            <label for="time">
              Heure
            </label>

            <input
              type="time"
              id="time"
              required
            >

          </div>


          <div class="full">

            <label for="imageUrl">
              Image / Affiche — URL
            </label>

            <input
              type="url"
              id="imageUrl"
              placeholder="https://..."
            >

          </div>


          <div class="full">

            <label for="description">
              Description
            </label>

            <textarea
              id="description"
              placeholder="Description de la soirée..."
            ></textarea>

          </div>

        </div>


        <div class="top-actions">

          <button
            type="submit"
            class="primary"
            id="submitButton"
          >
            Publier l'événement
          </button>

          <button
            type="button"
            class="secondary hidden"
            id="cancelButton"
            onclick="cancelEdit()"
          >
            Annuler
          </button>

        </div>

      </form>

      <div id="formMessage" class="message"></div>

    </section>


    <!-- LISTE -->

    <section class="card">

      <h2>📅 Événements</h2>

      <div id="eventsList" class="events-list">
        Chargement...
      </div>

    </section>

  </main>


<script>

  /*
  ==========================================================
  CONFIGURATION
  ==========================================================
  */

  const API_URL =
    "https://thehenhouse-reservation.maxgamingdu4.workers.dev";


  let adminCode = "";
  let editingId = null;


  /*
  ==========================================================
  LOGIN
  ==========================================================
  */

async function login() {

  const input = document.getElementById("adminCode");
  const message = document.getElementById("loginMessage");

  const code = input.value.trim();

  if (!code) {
    showMessage(
      "loginMessage",
      "Veuillez entrer le code administrateur.",
      "error"
    );
    return;
  }

  // On bloque l'accès pendant la vérification
  message.className = "message";
  message.textContent = "Vérification...";

  try {

    const response = await fetch(
      "https://thehenhouse-reservation.maxgamingdu4.workers.dev/admin/verify",
      {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + code
        },
        cache: "no-store"
      }
    );

    const data = await response.json();

    console.log("Réponse Cloudflare :", data);

    // CODE INCORRECT
    if (!response.ok || !data.success) {

      showMessage(
        "loginMessage",
        "❌ Code administrateur incorrect.",
        "error"
      );

      input.value = "";
      input.focus();

      return;
    }

    // CODE CORRECT
    adminCode = code;

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("adminSection")
      .classList.remove("hidden");

    input.value = "";

    loadEvents();

  } catch (error) {

    console.error(
      "Erreur de connexion admin :",
      error
    );

    showMessage(
      "loginMessage",
      "❌ Impossible de contacter le serveur.",
      "error"
    );

  }
}


  function logout() {

    adminCode = "";
    editingId = null;

    document
      .getElementById("adminSection")
      .classList.add("hidden");

    document
      .getElementById("loginSection")
      .classList.remove("hidden");

    document
      .getElementById("adminCode")
      .value = "";

    resetForm();
  }


  /*
  ==========================================================
  MESSAGES
  ==========================================================
  */

  function showMessage(id, text, type) {

    const element =
      document.getElementById(id);

    element.textContent = text;

    element.className =
      "message " + type;
  }


  /*
  ==========================================================
  CHARGER LES ÉVÉNEMENTS
  ==========================================================
  */

  async function loadEvents() {

    const list =
      document.getElementById("eventsList");

    list.innerHTML = "Chargement...";

    try {

      const response =
        await fetch(`${API_URL}/events`);

      const data =
        await response.json();

      if (!response.ok || !data.success) {
        throw new Error(
          data.error || "Erreur"
        );
      }

      renderEvents(data.events || []);

    } catch (error) {

      list.innerHTML =
        `<div class="message error">
          Impossible de charger les événements.
        </div>`;

    }
  }


  /*
  ==========================================================
  AFFICHAGE
  ==========================================================
  */

  function renderEvents(events) {

    const list =
      document.getElementById("eventsList");

    if (!events.length) {

      list.innerHTML =
        `<div class="message success">
          Aucun événement actuellement.
        </div>`;

      return;
    }

    list.innerHTML = events.map(event => {

      const image =
        event.image_url
          ? `<img
              src="${escapeHtml(event.image_url)}"
              class="event-image"
              alt=""
            >`
          : "";

      return `
        <div class="event">

          ${image}

          <div class="event-info">

            <div class="event-title">
              ${escapeHtml(event.title)}
            </div>

            <div class="event-meta">
              📅 ${escapeHtml(event.date)}
              &nbsp; • &nbsp;
              🕐 ${escapeHtml(event.time)}
            </div>

            <div class="event-description">
              ${escapeHtml(event.description || "")}
            </div>

          </div>

          <div class="actions">

            <button
              class="secondary"
              onclick="editEvent(${event.id})"
            >
              ✏️ Modifier
            </button>

            <button
              class="danger"
              onclick="deleteEvent(${event.id})"
            >
              🗑️ Supprimer
            </button>

          </div>

        </div>
      `;

    }).join("");
  }


  /*
  ==========================================================
  AJOUT / MODIFICATION
  ==========================================================
  */

  document
    .getElementById("eventForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const data = {

        title:
          document.getElementById("title").value.trim(),

        image_url:
          document.getElementById("imageUrl").value.trim(),

        date:
          document.getElementById("date").value,

        time:
          document.getElementById("time").value,

        description:
          document.getElementById("description").value.trim()

      };


      const method =
        editingId ? "PUT" : "POST";

      const url =
        editingId
          ? `${API_URL}/events/${editingId}`
          : `${API_URL}/events`;


      try {

        const response =
          await fetch(url, {

            method,

            headers: {
              "Content-Type": "application/json",
              "Authorization":
                `Bearer ${adminCode}`
            },

            body:
              JSON.stringify(data)

          });


        const result =
          await response.json();


        if (!response.ok || !result.success) {

          throw new Error(
            result.error || "Erreur"
          );

        }


        showMessage(
          "formMessage",
          editingId
            ? "Événement modifié avec succès."
            : "Événement créé avec succès.",
          "success"
        );


        resetForm();

        await loadEvents();


      } catch (error) {

        showMessage(
          "formMessage",
          error.message ||
            "Impossible d'enregistrer l'événement.",
          "error"
        );

      }

    });


  /*
  ==========================================================
  MODIFIER
  ==========================================================
  */

  async function editEvent(id) {

    try {

      const response =
        await fetch(`${API_URL}/events`);

      const data =
        await response.json();

      const event =
        data.events.find(
          item => Number(item.id) === Number(id)
        );

      if (!event) {
        alert("Événement introuvable.");
        return;
      }


      editingId = id;


      document.getElementById("title").value =
        event.title || "";

      document.getElementById("imageUrl").value =
        event.image_url || "";

      document.getElementById("date").value =
        event.date || "";

      document.getElementById("time").value =
        event.time || "";

      document.getElementById("description").value =
        event.description || "";


      document.getElementById("formTitle").textContent =
        "✏️ Modifier l'événement";

      document.getElementById("submitButton").textContent =
        "Enregistrer les modifications";

      document
        .getElementById("cancelButton")
        .classList.remove("hidden");


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    } catch {

      alert("Impossible de charger l'événement.");

    }

  }


  /*
  ==========================================================
  SUPPRIMER
  ==========================================================
  */

  async function deleteEvent(id) {

    if (!confirm(
      "Voulez-vous vraiment supprimer cet événement ?"
    )) {
      return;
    }


    try {

      const response =
        await fetch(
          `${API_URL}/events/${id}`,
          {
            method: "DELETE",

            headers: {
              "Authorization":
                `Bearer ${adminCode}`
            }
          }
        );


      const result =
        await response.json();


      if (!response.ok || !result.success) {

        throw new Error(
          result.error || "Erreur"
        );

      }


      await loadEvents();


    } catch (error) {

      alert(
        error.message ||
        "Impossible de supprimer l'événement."
      );

    }

  }


  /*
  ==========================================================
  RESET FORM
  ==========================================================
  */

  function resetForm() {

    editingId = null;

    document
      .getElementById("eventForm")
      .reset();

    document.getElementById("formTitle").textContent =
      "➕ Ajouter un événement";

    document.getElementById("submitButton").textContent =
      "Publier l'événement";

    document
      .getElementById("cancelButton")
      .classList.add("hidden");

  }


  function cancelEdit() {

    resetForm();

  }


  /*
  ==========================================================
  SÉCURITÉ AFFICHAGE
  ==========================================================
  */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

</script>

</body>
</html>
