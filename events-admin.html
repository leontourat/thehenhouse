<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration — The Hen House</title><link rel="stylesheet" href="style.css"></head>
<body class="admin-page">

<section id="loginSection" class="login-wrapper">
 <div class="login-card">
  <img class="login-logo" src="assets/logo.png" data-site-logo alt="The Hen House">
  <div class="kicker">The Hen House</div><h1>Administration</h1>
  <p class="subtitle">Paleto Bay</p>
  <div class="login-form">
   <label for="adminCode">Code administrateur</label>
   <input id="adminCode" type="password" autocomplete="off" placeholder="Entrez votre code">
   <button id="loginButton" class="btn login-button" type="button">🔐 Se connecter</button>
   <div id="loginMessage" class="message"></div>
  </div>
 </div>
</section>

<section id="adminSection" class="admin-shell hidden">
 <div class="admin-header">
  <div><div class="kicker">The Hen House</div><h1>Panneau <span>Admin</span></h1></div>
  <div class="admin-actions">
   <a class="btn outline" href="events.html">Voir le site</a>
   <button id="logoutButton" class="btn danger" type="button">Déconnexion</button>
  </div>
 </div>

 <div class="admin-nav">
  <button class="active" data-section="maintenanceSection">Maintenance</button>
  <button data-section="eventsSection">Événements</button>
  <button data-section="backgroundsSection">Fonds du site</button>
  <button data-section="logoSection">Logo</button>
 </div>

 <div id="maintenanceSection" class="admin-section active">
  <div class="admin-card">
   <h2>Mode maintenance</h2>
   <p class="small">Le mode maintenance bloque les pages publiques. Cette administration reste accessible.</p>
   <br><button id="maintenanceButton" class="btn" type="button">Vérification...</button>
  </div>
 </div>

 <div id="eventsSection" class="admin-section">
  <div class="admin-grid">
   <div class="admin-card">
    <h2 id="eventFormTitle">Créer un événement</h2>
    <form id="eventForm">
     <input type="hidden" id="eventId">
     <label>Titre</label><input id="eventTitle" required>
     <label>Image URL</label><input id="eventImage" placeholder="https://...">
     <label>Date</label><input id="eventDate" type="date" required>
     <label>Heure</label><input id="eventTime" type="time" required>
     <label>Description</label><textarea id="eventDescription"></textarea>
     <button class="btn" type="submit">Enregistrer</button>
     <button id="cancelEventEdit" class="btn outline hidden" type="button">Annuler la modification</button>
    </form>
   </div>
   <div class="admin-card">
    <h2>Événements existants</h2>
    <div id="eventList" class="admin-list"></div>
   </div>
  </div>
 </div>

 <div id="backgroundsSection" class="admin-section">
  <div class="admin-card">
   <h2>Fonds du site</h2>
   <form id="backgroundForm">
    <label>Page</label>
    <select id="backgroundPage">
     <option value="home">Accueil</option><option value="menu">Carte</option><option value="events">Événements</option>
     <option value="reservation">Réservation</option><option value="contact">Contact</option>
     <option value="alcool">Alcool</option><option value="cocktails">Cocktails</option><option value="mocktails">Mocktails</option>
     <option value="soft">Soft</option><option value="grignotage">Grignotage</option>
    </select>
    <label>URL de l'image</label><input id="backgroundUrl" placeholder="https://...">
    <img id="backgroundPreview" class="preview hidden" alt="Aperçu">
    <button class="btn" type="submit">Enregistrer le fond</button>
    <button id="deleteBackground" class="btn danger" type="button">Supprimer le fond</button>
   </form>
  </div>
 </div>

 <div id="logoSection" class="admin-section">
  <div class="admin-card">
   <h2>Logo du site</h2>
   <form id="logoForm">
    <label>URL du logo</label><input id="logoUrl" placeholder="https://...">
    <img id="logoPreview" class="preview hidden" alt="Aperçu du logo">
    <button class="btn" type="submit">Enregistrer le logo</button>
    <button id="resetLogo" class="btn danger" type="button">Remettre le logo par défaut</button>
   </form>
  </div>
 </div>
</section>

<script src="admin.js"></script>
<script src="logo-loader.js"></script>
</body></html>
