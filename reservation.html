<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réservation — The Hen House</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="">
<script src="maintenance-check.js"></script>
<header>
  <div class="container nav">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" data-site-logo alt="The Hen House">
    </a>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="menu.html">Carte</a>
      <a href="events.html">Événements</a>
      <a href="reservation.html">Réserver</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <a class="btn" href="reservation.html">Réserver</a>
      <a class="btn admin-header-btn" href="events-admin.html">Administration</a>
    </div>
  </div>
</header>

<main>
<section class="page-hero"><div class="container">
<div class="kicker">The Hen House</div><h1>Réserver une <span>table</span></h1>
<p>Envoyez votre demande de réservation.</p>
</div></section>
<section><div class="container">
<div id="reservationMessage" class="message"></div>
<form id="reservationForm">
<label for="name">Nom / Prénom</label><input id="name" name="name" required>
<label for="people">Nombre de personnes</label><input id="people" name="people" type="number" min="1" required>
<label for="date">Date</label><input id="date" name="date" type="date" required>
<label for="time">Heure</label><input id="time" name="time" type="time" required>
<label for="message">Message</label><textarea id="message" name="message" placeholder="Précisions éventuelles"></textarea>
<button class="btn" type="submit">Envoyer la réservation</button>
</form>
</div></section>
</main>
<script>
const API_URL="https://thehenhouse-reservation.maxgamingdu4.workers.dev";
document.getElementById("reservationForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const form=e.currentTarget,msg=document.getElementById("reservationMessage");
 msg.className="message show info";msg.textContent="Envoi de votre réservation...";
 try{
  const r=await fetch(API_URL+"/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
   name:form.name.value.trim(),people:form.people.value,date:form.date.value,time:form.time.value,message:form.message.value.trim()
  })});
  const d=await r.json();
  if(!r.ok||!d.success)throw new Error(d.error||"Erreur");
  msg.className="message show success";msg.textContent=" Votre demande de réservation a bien été envoyée.";
  form.reset();
 }catch(err){msg.className="message show error";msg.textContent=" "+err.message}
});
</script>

<footer>
  <div class="container">
    <p>THE HEN HOUSE • PALETO BAY • SAN ANDREAS</p>
    <p>© 2026 The Hen House</p>
  </div>
</footer>
<script src="background-loader.js"></script>
<script src="logo-loader.js"></script>
</body>
</html>
